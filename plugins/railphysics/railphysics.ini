; railphysics - realistic rail vehicle dynamics. This file is UTF-8, no BOM.
;
; Read by plugins\railphysics.dll. Deleting the DLL removes the feature
; entirely; this file only tunes it. Nothing here changes the save format:
; the game stores positions and speeds, not the physics that produced them,
; so a save made with this plugin loads fine without it (trains just go back
; to accelerating like sports cars).
;
; Do not save this file with PowerShell's -Encoding UTF8. It writes a BOM, the
; section header stops matching, and every setting below silently falls back.

[railphysics]

; 0 unloads the plugin without touching anything.
enabled = 1

; ------------------------------------------------------------- presets
;
; Three coherent configurations, validated in game:
;
;   STRICT REALISM      power_scale = 1.0   curve_lateral_ms2 = 1.0
;                       grid_boost = 1.0
;                       (honest everything; high-speed trains need long
;                       clear straights and a beefy grid - for purists)
;
;   BALANCED (default)  power_scale = 1.35  curve_lateral_ms2 = 1.4
;                       grid_boost = 2.0
;                       (realistic starts and heavy trains, but a CR400
;                       actually reaches 300+ on decent track)
;
;   ARCADE              power_scale = 1.6   curve_lateral_ms2 = 1.6
;                       grid_boost = 2.5    brake_min_vanilla_ratio = 1.0
;                       (snappy but still physically shaped)


; ------------------------------------------------------------- subsystems
;
; Each of the four can be switched independently. Vanilla behaviour for
; anything switched off.

; Traction and resistance: acceleration follows F = min(P/v, mu*W_adhesive)
; minus Davis resistance and gravity, instead of the vanilla constant-rate
; 3.61*sqrt(P/(5m)) km/h/s. Heavy trains crawl away from a standstill, light
; ones go, and every train has a balancing speed where power equals drag.
accel = 1

; Braking: independent of acceleration, at the rates below, instead of
; "one third of whatever the acceleration is".
brake = 1

; Gravity works both ways: downhill sections push the train instead of doing
; nothing, uphill resistance no longer depends on engine power.
slope = 1

; Fuel/energy burn follows the mechanical power actually being delivered
; (full effort while accelerating, drag equilibrium in cruise, idle at a
; standstill) instead of the vanilla speed-ratio curve. Absolute rates stay
; on the game's own scale - only the shape of consumption changes.
fuel = 1

; Curve speed limits: the route ahead is scanned for curvature, and the
; train brakes in advance so it enters every curve at sqrt(a_lat * R).
; The base game has no curve limits at all - this is new behaviour, and on
; winding player-built track it WILL slow trains down. That is the point.
curves = 1

; Station speed limit: station track (cargo, passenger and waiting
; stations) is a zone capped at station_limit_kmh, entered through the same
; braking curve as curves - the train slows in advance and accelerates after
; leaving. Applies to trains passing through without stopping, too.
stations = 1

; Smooth stops: a scheduled stop gets a braking parabola to zero, ending
; 25 m out where vanilla's own 20 m ramp takes over. Replaces the
; last-second slam with an approach that starts kilometres out. The
; trigger is a position match: the route ends at the next stop from
; departure, so a terminal node sitting on a station or customhouse
; track node means a stop there - the remaining route length is the
; exact distance. (The stop-intent bytes +0xD39/+0xD3C were tried and
; REMOVED: on re-chunked routes their route-length estimate is off by
; hundreds of metres.) Also smooths end-of-line stops.
smoothstop = 1

; Customs (border) stops: the route array never reaches the customs from
; afar (it is extended in chunks; customhouse legs enter it only ~115 m
; out), so no route-based detector can brake early. Instead, static
; "corridors" are precomputed: a graph walk from every customhouse track
; node over the world geometry, 8 km out. A route that descends through a
; corridor toward the entry gets a braking parabola to customs_entry_kmh
; AT the border; the final stop inside the zone then rides the same
; parabola to zero once the route extends in. Trains moving away from the
; border (or turning off) do not brake.
customstop = 1

; Speed target at the customs zone entry, km/h. The train crosses the
; border fence at this speed and the zero-parabola inside the zone takes
; it the rest of the way to the stop. 40-60 is the firm-but-fair range.
customs_entry_kmh = 50


; ------------------------------------------------------------- curves

; The limit itself, km/h. 30 is a conservative yard figure; real mainlines
; allow 40-60 through a station on the straight track. Note the constraint
; follows the head of the train: a long consist's tail may still be inside
; when the limit lifts.
station_limit_kmh = 60

; Lateral acceleration comfort limit in curves, m/s^2. This is the whole
; "how much do curves slow trains" knob. Real railways compute curve speeds
; WITH rail superelevation (cant), which this model cannot see in the track
; geometry - so values above the bare 0.7 are physically defensible:
;   0.7  strict, no cant allowance
;   1.0  mild mainline
;   1.4  mainline with cant (default, validated)
;   1.6  arcade
; Switches (R < 200 m) stay slow at any of these, as they should.
curve_lateral_ms2 = 1.4

; Safety factor on the braking-distance budget: the train starts braking as
; if its deceleration were service_brake_ms2 divided by this. 1.25 = brake
; with 25 % in reserve. 1.0 brakes at the theoretical last moment - do not.
curve_brake_margin = 1.25

; How far ahead the route is scanned for curves, metres - the FLOOR of the
; scan window. The real horizon grows with speed: it is never shorter than
; the full-stop braking distance from the current speed plus 150 m (a train
; at 270 km/h scans ~4.5 km ahead). Raise this if very fast trains still
; meet curves too late.
curve_lookahead_m = 1200

; 1 prints the computed curve limit and tightest radius per train, roughly
; once a second - the calibration tool for the two numbers above.
log_curves = 0


; ------------------------------------------------------------- the physics

; Wheel-on-rail adhesion coefficient. 0.30 is dry sanded rail; 0.20 is wet.
; This caps tractive effort at low speed: a 82 t locomotive cannot pull
; harder than 0.30 * 82 t * g ~= 241 kN no matter its power.
adhesion_mu = 0.30

; Arcade multiplier on engine power. 1.0 = honest physics. Low speed is
; adhesion-capped anyway, so this only livens the mid/high-speed tail of
; acceleration - the part where real physics feels slow to a player.
; 1.25-1.5 is a gentle arcade preset; fuel demand scales along, so it is
; not a free lunch. Sane range 0.1-5.0.
; 2026-08: 1.35 -> 1.5 (user call: slightly brisker acceleration for the
; small test map).
power_scale = 1.5

; Davis resistance, R = mass_t*(A + B*v) + C*v^2 newtons, v in km/h.
; A and B are per tonne of train (rolling/bearing), C is whole-train aero.
; Defaults are mid-range freight; raise C for fast passenger stock.
davis_a = 1.5
davis_b = 0.006
davis_c = 0.40

; The game stores slope as pitch/0.12 clamped to +-1, so 1.0 means a 12 %
; grade. This scale converts it back. Change only if you want to exaggerate
; or soften every grade at once (1.0 = a 100 % grade at full deflection).
grade_scale = 0.06


; ------------------------------------------------------------- braking
;
; Deceleration in m/s^2. Real freight: 0.5-0.9 service, up to 1.3 emergency.
; For reference, vanilla effectively gives a fresh 4000 kW / 82 t locomotive
; about 1.05 m/s2 and scales DOWN with mass from there.
; 2026-08 arcade recalibration (user call: the map is too small for 100%
; realism): service 0.8 -> 1.6 halves every braking distance; the emergency
; rate keeps its 1.625x ratio. All braking parabolas (curves, stations,
; stops, customs) derive from these, so they shorten automatically.
service_brake_ms2  = 1.6
emergency_brake_ms2 = 2.6

; Safety net for the game's own logic: signals and station approaches assume
; a train can stop about as fast as vanilla. With this at 1.0 the brakes are
; never weaker than vanilla's would have been - realism only ever makes them
; STRONGER. Set to 0 for full realism (heavy trains need a long runway -
; watch your junctions) or something in between.
brake_min_vanilla_ratio = 1.0


; ------------------------------------------------------------- fuel

; Load factor at a standstill or coasting downhill - the engine idling.
; Vanilla effectively never drops below 0.15. 0.05 is a quiet idle; 0 makes
; stopped trains free.
idle_load = 0.05

; Cap on the load factor. 1.0 = "rated power" on the game's own burn scale,
; which keeps refuel cadence and fuel logistics roughly as balanced. Values
; above 1 let hard-working trains burn more than vanilla's maximum.
fuel_load_max = 1.0

; Grid boost: multiplies the plant outflow ceiling that caps total grid
; throughput (shared by the whole town AND the railway). Vanilla sized it
; for a town plus the vanilla traction load curve, which rarely asked for
; full power; honest electric traction can sag the grid (delivered fraction
; << 1, trains crawl). 1.0 = off; 2-3 feeds high-speed electric properly.
; Side effect: the whole town's electricity moves faster too.
grid_boost = 2.0

; Demand-side scale for electric trains: the catenary request is multiplied
; by this before asking the grid. 1.0 = honest demand; 0.5 asks for half
; (the grid copes, acceleration recovers, but the energy bill is fictitious).
; Prefer grid_boost and real infrastructure; this is the cheap way out.
electric_load_scale = 1.0


; ------------------------------------------------------------- debugging

; 1 prints one line per train every few seconds to tesmioloader.log:
; speed, mass, power, traction/resistance/gravity forces and acceleration.
; This is the calibration tool - turn it on, watch a train you know, and
; tune the numbers above until it behaves like the real thing.
log_physics = 0

; 1 enables the decision flight recorder: per-train event lines (prefix
; "decision T…xxxx") when a limiter engages/changes/releases, brake ON/OFF
; flips against the active limit, and a 1 s snapshot while a stop/customs
; limiter is active. The tool for "why did that train not brake" - from the
; log alone you can narrate an approach: what the scanner saw, which
; estimate drove the parabola, and when the brake pulsed.
log_decisions = 0
